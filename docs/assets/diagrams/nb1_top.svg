<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 840" width="100%" style="max-width: 360px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="360" height="840" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

  <!-- Diagram Title Header -->
  <rect x="0" y="0" width="360" height="42" rx="10" fill="#0f172a" />
  <rect x="0" y="32" width="360" height="10" fill="#0f172a" />
  <line x1="0" y1="42" x2="360" y2="42" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
  <text x="180" y="26" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700" letter-spacing="0.05em">
    CONVENTIONAL FMCW RADAR DSP
  </text>

  <!-- Step 1: RF Chirp Transmission & Synthesis -->
  <g transform="translate(25, 56)" filter="url(#shadow)">
    <rect width="310" height="54" rx="6" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="10" y="10" width="60" height="18" rx="3" fill="url(#accentGrad)" />
    <text x="40" y="23" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">STAGE 1</text>
    <text x="80" y="23" fill="#f8fafc" font-size="12" font-weight="700">77 GHz FMCW Chirp Tx</text>
    <text x="14" y="42" fill="#94a3b8" font-size="10.5">Sawtooth sweep (B = 1.0 GHz, Tc = 50 µs)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="180" y1="110" x2="180" y2="128" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: Mixer, Dechirp & 3D ADC Cube -->
  <g transform="translate(25, 130)" filter="url(#shadow)">
    <rect width="310" height="54" rx="6" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="10" y="10" width="60" height="18" rx="3" fill="url(#accentGrad)" />
    <text x="40" y="23" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">STAGE 2</text>
    <text x="80" y="23" fill="#f8fafc" font-size="12" font-weight="700">Dechirp &amp; 3D Radar Cube</text>
    <text x="14" y="42" fill="#94a3b8" font-size="10.5">Beat signal: X ∈ ℂ^(4 × 128 × 256) (Rx × Chirp × Fast-time)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="180" y1="184" x2="180" y2="202" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3: Fast-Time 1D Range FFT -->
  <g transform="translate(25, 204)" filter="url(#shadow)">
    <rect width="310" height="54" rx="6" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="10" y="10" width="60" height="18" rx="3" fill="url(#accentGrad)" />
    <text x="40" y="23" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">STAGE 3</text>
    <text x="80" y="23" fill="#f8fafc" font-size="12" font-weight="700">1D Fast-Time Range FFT</text>
    <text x="14" y="42" fill="#94a3b8" font-size="10.5">Hann windowing · Range bin resolution ΔR = 0.15 m</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="180" y1="258" x2="180" y2="276" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 4: MTI Clutter Suppression -->
  <g transform="translate(25, 278)" filter="url(#shadow)">
    <rect width="310" height="54" rx="6" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="10" y="10" width="60" height="18" rx="3" fill="url(#accentGrad)" />
    <text x="40" y="23" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">STAGE 4</text>
    <text x="80" y="23" fill="#f8fafc" font-size="12" font-weight="700">MTI Clutter Suppression</text>
    <text x="14" y="42" fill="#94a3b8" font-size="10.5">Slow-time mean subtraction · Removes zero-Doppler clutter</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="180" y1="332" x2="180" y2="350" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 5: Slow-Time Doppler FFT & RDM -->
  <g transform="translate(25, 352)" filter="url(#shadow)">
    <rect width="310" height="54" rx="6" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="10" y="10" width="60" height="18" rx="3" fill="url(#accentGrad)" />
    <text x="40" y="23" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">STAGE 5</text>
    <text x="80" y="23" fill="#f8fafc" font-size="12" font-weight="700">2D Slow-Time Doppler FFT</text>
    <text x="14" y="42" fill="#94a3b8" font-size="10.5">FFT shift across chirps · Produces Range-Doppler Matrix</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="180" y1="406" x2="180" y2="424" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 6: 2D CA-CFAR Detection -->
  <g transform="translate(25, 426)" filter="url(#shadow)">
    <rect width="310" height="54" rx="6" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="10" y="10" width="60" height="18" rx="3" fill="url(#accentGrad)" />
    <text x="40" y="23" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">STAGE 6</text>
    <text x="80" y="23" fill="#f8fafc" font-size="12" font-weight="700">2D CA-CFAR Detection</text>
    <text x="14" y="42" fill="#94a3b8" font-size="10.5">Adaptive CUT thresholding (Pfa = 10^-4) · Extracts peaks</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <line x1="180" y1="480" x2="180" y2="498" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 7: Spatial Array MUSIC AoA -->
  <g transform="translate(25, 500)" filter="url(#shadow)">
    <rect width="310" height="54" rx="6" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="10" y="10" width="60" height="18" rx="3" fill="url(#accentGrad)" />
    <text x="40" y="23" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">STAGE 7</text>
    <text x="80" y="23" fill="#f8fafc" font-size="12" font-weight="700">Spatial MUSIC AoA</text>
    <text x="14" y="42" fill="#94a3b8" font-size="10.5">Covariance Rxx eigen-decomposition · Azimuth angle θ</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <line x1="180" y1="554" x2="180" y2="572" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 8: DBSCAN Spatial Clustering -->
  <g transform="translate(25, 574)" filter="url(#shadow)">
    <rect width="310" height="54" rx="6" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="10" y="10" width="60" height="18" rx="3" fill="url(#accentGrad)" />
    <text x="40" y="23" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">STAGE 8</text>
    <text x="80" y="23" fill="#f8fafc" font-size="12" font-weight="700">DBSCAN BEV Clustering</text>
    <text x="14" y="42" fill="#94a3b8" font-size="10.5">Cartesian BEV (x = R sin θ, y = R cos θ) · Groups returns</text>
  </g>

  <!-- Arrow 8 -> Output -->
  <line x1="180" y1="628" x2="180" y2="646" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Final Output Card -->
  <g transform="translate(25, 648)" filter="url(#shadow)">
    <rect width="310" height="66" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="155" y="24" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="700" letter-spacing="0.04em">OUTPUT TARGET TRACKS</text>
    <text x="155" y="42" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">Objects: [Car, Pedestrian, Cyclist, Drone]</text>
    <text x="155" y="57" text-anchor="middle" fill="#6ee7b7" font-size="10">Kinematics: Range (m), Velocity (m/s), Azimuth (°)</text>
  </g>

  <!-- Micro-Doppler Branch Note -->
  <g transform="translate(25, 730)">
    <rect width="310" height="42" rx="4" fill="rgba(30, 41, 59, 0.4)" stroke="#334155" stroke-dasharray="3 3" />
    <text x="155" y="18" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Auxiliary Track: Micro-Doppler STFT</text>
    <text x="155" y="32" text-anchor="middle" fill="#64748b" font-size="9.5">Short-Time Fourier Transform resolves pedestrian limb cadence</text>
  </g>

  <!-- Footer Indicator -->
  <text x="180" y="810" text-anchor="middle" fill="#475569" font-size="9.5" font-style="italic">
    Single-Column Form Factor · Publication-Grade A4 Report Compatible
  </text>
</svg>