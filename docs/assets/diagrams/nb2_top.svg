<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 686" width="100%" style="max-width: 360px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a78bfa" />
    </marker>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="360" height="686" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

  <!-- Diagram Title Header -->
  <rect x="0" y="0" width="360" height="42" rx="10" fill="#0f172a" />
  <rect x="0" y="32" width="360" height="10" fill="#0f172a" />
  <line x1="0" y1="42" x2="360" y2="42" stroke="#a78bfa" stroke-width="1.5" opacity="0.6" />
  <text x="180" y="26" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700" letter-spacing="0.05em">
    RADAR OBJECT DETECTOR CNN
  </text>

  <!-- Step 1: Input Tensor -->
  <g transform="translate(25, 56)" filter="url(#shadow2)">
    <rect width="310" height="52" rx="6" fill="url(#boxGrad2)" stroke="#a78bfa" stroke-width="1.2" />
    <rect x="10" y="10" width="60" height="18" rx="3" fill="url(#accentGrad2)" />
    <text x="40" y="23" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">INPUT</text>
    <text x="80" y="23" fill="#f8fafc" font-size="12" font-weight="700">Range-Doppler Tensor</text>
    <text x="14" y="41" fill="#cbd5e1" font-size="10.5">X ∈ ℝ^(1 × 128 × 256) · Min-max normalized</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="180" y1="108" x2="180" y2="124" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow2)" />

  <!-- Step 2: ConvBlock 1 -->
  <g transform="translate(25, 126)" filter="url(#shadow2)">
    <rect width="310" height="52" rx="6" fill="url(#boxGrad2)" stroke="#a78bfa" stroke-width="1.2" />
    <rect x="10" y="10" width="60" height="18" rx="3" fill="url(#accentGrad2)" />
    <text x="40" y="23" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">BLOCK 1</text>
    <text x="80" y="23" fill="#f8fafc" font-size="12" font-weight="700">Feature Extraction Conv</text>
    <text x="14" y="41" fill="#cbd5e1" font-size="10.5">Conv2D(1→32, k=3) + 2× ResBlock(32) · LeakyReLU</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="180" y1="178" x2="180" y2="194" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow2)" />

  <!-- Step 3: ConvBlock 2 -->
  <g transform="translate(25, 196)" filter="url(#shadow2)">
    <rect width="310" height="52" rx="6" fill="url(#boxGrad2)" stroke="#a78bfa" stroke-width="1.2" />
    <rect x="10" y="10" width="60" height="18" rx="3" fill="url(#accentGrad2)" />
    <text x="40" y="23" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">BLOCK 2</text>
    <text x="80" y="23" fill="#f8fafc" font-size="12" font-weight="700">Intermediate Deep Conv</text>
    <text x="14" y="41" fill="#cbd5e1" font-size="10.5">Conv2D(32→64, k=3) + BatchNorm + LeakyReLU</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="180" y1="248" x2="180" y2="264" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow2)" />

  <!-- Step 4: ConvBlock 3 / Residual -->
  <g transform="translate(25, 266)" filter="url(#shadow2)">
    <rect width="310" height="52" rx="6" fill="url(#boxGrad2)" stroke="#a78bfa" stroke-width="1.2" />
    <rect x="10" y="10" width="60" height="18" rx="3" fill="url(#accentGrad2)" />
    <text x="40" y="23" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">BLOCK 3</text>
    <text x="80" y="23" fill="#f8fafc" font-size="12" font-weight="700">Residual Latent Backbone</text>
    <text x="14" y="41" fill="#cbd5e1" font-size="10.5">2× ResBlock(64) · Skip Connections (64×128×256)</text>
  </g>

  <!-- Fork Arrows 4 -> Dual Heads -->
  <path d="M 180 318 L 180 334 L 105 334 L 105 348" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow2)" />
  <path d="M 180 318 L 180 334 L 255 334 L 255 348" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow2)" />

  <!-- Dual Perception Heads (Side by Side in single column) -->
  <g transform="translate(25, 350)" filter="url(#shadow2)">
    <!-- Classification Head -->
    <rect x="0" y="0" width="148" height="74" rx="6" fill="url(#boxGrad2)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="74" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">Classification Head</text>
    <text x="74" y="38" text-anchor="middle" fill="#f8fafc" font-size="10">Conv(64→32) + Conv(1×1)</text>
    <text x="74" y="54" text-anchor="middle" fill="#94a3b8" font-size="9.5">BCE Logits Heatmap</text>
    <text x="74" y="67" text-anchor="middle" fill="#64748b" font-size="8.5">4 Target Classes</text>

    <!-- Regression Head -->
    <rect x="162" y="0" width="148" height="74" rx="6" fill="url(#boxGrad2)" stroke="#f43f5e" stroke-width="1.2" />
    <text x="236" y="20" text-anchor="middle" fill="#f43f5e" font-size="11" font-weight="700">Regression Head</text>
    <text x="236" y="38" text-anchor="middle" fill="#f8fafc" font-size="10">Conv(64→32) + Conv(1×1)</text>
    <text x="236" y="54" text-anchor="middle" fill="#94a3b8" font-size="9.5">Sigmoid Coordinates</text>
    <text x="236" y="67" text-anchor="middle" fill="#64748b" font-size="8.5">(cx, cy, w, h)</text>
  </g>

  <!-- Join Arrows from Heads -> Loss Block -->
  <path d="M 99 424 L 99 444 L 180 444 L 180 458" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow2)" />
  <path d="M 261 424 L 261 444 L 180 444 L 180 458" fill="none" stroke="#a78bfa" stroke-width="2" />

  <!-- Multi-Task Loss Formulation -->
  <g transform="translate(25, 460)" filter="url(#shadow2)">
    <rect width="310" height="54" rx="6" fill="url(#boxGrad2)" stroke="#a78bfa" stroke-width="1.2" />
    <text x="155" y="22" text-anchor="middle" fill="#a78bfa" font-size="11.5" font-weight="700">Multi-Task Composite Loss</text>
    <text x="155" y="42" text-anchor="middle" fill="#f8fafc" font-size="11">ℒ_total = ℒ_BCE(cls) + 2 · ℒ_SmoothL1(box)</text>
  </g>

  <!-- Arrow Loss -> Post-Processing -->
  <line x1="180" y1="514" x2="180" y2="532" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow2)" />

  <!-- Step 6: Post-Processing & Peak Extraction -->
  <g transform="translate(25, 534)" filter="url(#shadow2)">
    <rect width="310" height="54" rx="6" fill="url(#boxGrad2)" stroke="#a78bfa" stroke-width="1.2" />
    <rect x="10" y="10" width="60" height="18" rx="3" fill="url(#accentGrad2)" />
    <text x="40" y="23" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">POST</text>
    <text x="80" y="23" fill="#f8fafc" font-size="12" font-weight="700">Spatial Peak Extraction</text>
    <text x="14" y="42" fill="#cbd5e1" font-size="10.5">Heatmap local maximum thresholding + box decode</text>
  </g>

  <!-- Arrow Post -> Final Output -->
  <line x1="180" y1="588" x2="180" y2="606" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow2)" />

  <!-- Final Output Card -->
  <g transform="translate(25, 608)" filter="url(#shadow2)">
    <rect width="310" height="66" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="155" y="24" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="700" letter-spacing="0.04em">DETECTED OBJECT ENVELOPE</text>
    <text x="155" y="42" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">Bounding Boxes + Semantic Class Probabilities</text>
    <text x="155" y="57" text-anchor="middle" fill="#6ee7b7" font-size="10">End-to-End: 136,041 Trainable Weights · 26.89s Train</text>
  </g>
</svg>