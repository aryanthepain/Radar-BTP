<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 435" width="100%" style="max-width: 860px; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="grad-fmcw-31" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="grad-raddet-31" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="grad-eval-31" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818cf8" />
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2dd4bf" />
    </marker>
    <filter id="shadow-f31" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="435" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

  <!-- Branch 1: Synthetic FMCW Radar Perception -->
  <rect x="20" y="20" width="400" height="235" rx="8" fill="url(#grad-fmcw-31)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow-f31)"/>
  <text x="220" y="45" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.05em">BRANCH 1: SYNTHETIC FMCW RADAR PERCEPTION</text>
  
  <rect x="40" y="65" width="360" height="32" rx="4" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="220" y="86" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="middle">Synthetic 77 GHz FMCW Radar Simulation</text>
  
  <line x1="220" y1="97" x2="220" y2="112" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="40" y="112" width="360" height="32" rx="4" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="220" y="133" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Complex Baseband Radar Cube (4 × 128 × 256)</text>
  
  <line x1="130" y1="144" x2="130" y2="160" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="310" y1="144" x2="310" y2="160" stroke="#38bdf8" stroke-width="1.5"/>
  
  <rect x="40" y="160" width="170" height="42" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="125" y="178" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Conventional Radar DSP</text>
  <text x="125" y="193" fill="#94a3b8" font-size="9.5" text-anchor="middle">FFT · MTI · CFAR · MUSIC · DBSCAN</text>
  
  <rect x="230" y="160" width="170" height="42" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="315" y="178" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Multi-Task Radar CNN</text>
  <text x="315" y="193" fill="#94a3b8" font-size="9.5" text-anchor="middle">Class Heatmaps &amp; Coordinate Regr.</text>
  
  <rect x="40" y="212" width="360" height="30" rx="4" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="220" y="232" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Spatial Target Detections, Extents &amp; Kinematics</text>

  <!-- Branch 2: Wideband Radar Spectrum Detection -->
  <rect x="460" y="20" width="400" height="235" rx="8" fill="url(#grad-raddet-31)" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow-f31)"/>
  <text x="660" y="45" fill="#2dd4bf" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.05em">BRANCH 2: WIDEBAND RADAR SPECTRUM DETECTION</text>
  
  <rect x="480" y="65" width="360" height="32" rx="4" fill="#1e293b" stroke="#0d9488" stroke-width="1"/>
  <text x="660" y="86" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="middle">RadDet Benchmark Dataset (ICASSP 2025)</text>
  
  <line x1="660" y1="97" x2="660" y2="112" stroke="#2dd4bf" stroke-width="1.5"/>
  <rect x="480" y="112" width="360" height="32" rx="4" fill="#1e293b" stroke="#0d9488" stroke-width="1"/>
  <text x="660" y="133" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Time-Frequency Spectrograms (S-128: 128 × 128)</text>
  
  <line x1="660" y1="144" x2="660" y2="160" stroke="#2dd4bf" stroke-width="1.5"/>
  <rect x="480" y="160" width="360" height="42" rx="4" fill="#0f172a" stroke="#0d9488" stroke-width="1"/>
  <text x="660" y="178" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">YOLOv9-C Deep Spectrum Detector</text>
  <text x="660" y="193" fill="#94a3b8" font-size="9.5" text-anchor="middle">11 Modulation Classes · GELAN-C Backbone · AdamW</text>
  
  <rect x="480" y="212" width="360" height="30" rx="4" fill="#1e293b" stroke="#0d9488" stroke-width="1"/>
  <text x="660" y="232" fill="#2dd4bf" font-size="11" font-weight="600" text-anchor="middle">Multi-SNR (-20 to +20 dB) &amp; Latency Evaluation</text>

  <!-- Convergence arrows to stage 3 -->
  <path d="M 220 255 L 220 285 L 420 285 L 420 295" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 660 255 L 660 285 L 460 285 L 460 295" fill="none" stroke="#2dd4bf" stroke-width="2"/>

  <!-- Common Stage: Computational and Resource-Efficiency Evaluation -->
  <rect x="120" y="295" width="640" height="118" rx="8" fill="url(#grad-eval-31)" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow-f31)"/>
  <text x="440" y="322" fill="#c7d2fe" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.06em">COMPUTATIONAL &amp; RESOURCE-EFFICIENCY INVESTIGATION</text>
  
  <rect x="140" y="335" width="285" height="64" rx="5" fill="#1e293b" stroke="#4f46e5" stroke-width="1"/>
  <text x="282" y="355" fill="#818cf8" font-size="11" font-weight="700" text-anchor="middle">Algorithm-Level Efficiency</text>
  <text x="282" y="372" fill="#94a3b8" font-size="10" text-anchor="middle">Lightweight Architectures · Pruning &amp; INT8 Quant</text>
  <text x="282" y="388" fill="#94a3b8" font-size="10" text-anchor="middle">Distillation · Adaptive Computation Allocation</text>
  
  <rect x="455" y="335" width="285" height="64" rx="5" fill="#1e293b" stroke="#4f46e5" stroke-width="1"/>
  <text x="597" y="355" fill="#818cf8" font-size="11" font-weight="700" text-anchor="middle">Hardware-Oriented Deployment</text>
  <text x="597" y="372" fill="#94a3b8" font-size="10" text-anchor="middle">Native CPU vs. GPU Inference Benchmarks</text>
  <text x="597" y="388" fill="#94a3b8" font-size="10" text-anchor="middle">CPU Runtimes · Quantization · Constrained Optimization</text>
</svg>
